<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field Report</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header class="masthead">
      <div>
        <p class="kicker">Active delivery portfolio</p>
        <h1>Field Report</h1>
        <p id="freshness">Loading current snapshot…</p>
      </div>
      <div class="masthead-actions"><button id="new-workstream" type="button">New outcome</button><button id="refresh" type="button">Refresh</button></div>
    </header>

    <nav id="repo-nav" class="repo-nav" aria-label="Repository filter"></nav>

    <section class="portfolio-section" aria-labelledby="portfolio-title">
      <header class="section-head">
        <div><h2 id="portfolio-title">Portfolio</h2><p id="portfolio-signal"></p></div>
        <span id="total-streams"></span>
      </header>
      <div id="selection-actions" class="selection-actions" aria-live="polite">
        <span id="selection-count">Select outcomes to request fresh reviewer judgment.</span>
        <button id="request-assessment" type="button" disabled>Request assessment</button>
      </div>
      <div id="portfolio" class="portfolio"></div>
    </section>

    <section id="workstream-brief" class="workstream-brief" aria-live="polite"></section>

    <details class="health">
      <summary>Source health</summary>
      <pre id="health"></pre>
    </details>
    <dialog id="new-workstream-dialog">
      <form id="new-workstream-form">
        <header><div><p class="kicker">Field Report</p><h2>New outcome</h2></div><button class="dialog-close" type="button" aria-label="Close new outcome form">Close</button></header>
        <label>Repository<select name="project" required></select></label>
        <label>Outcome title<input name="title" required maxlength="160" placeholder="Document-zone cutover"></label>
        <label>Intended outcome<textarea name="outcome" required maxlength="1200" rows="4" placeholder="What should be true when this workstream is done?"></textarea></label>
        <div class="form-pair"><label>Orchestrator<input name="orchestrator" placeholder="AF agent name"></label><label>Reviewer<input name="reviewer" placeholder="AF agent name"></label></div>
        <label>Starting branch <span>(optional)</span><input name="branch" placeholder="agent/document-cutover"></label>
        <footer><span class="form-status" aria-live="polite"></span><button type="submit">Create outcome</button></footer>
      </form>
    </dialog>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
